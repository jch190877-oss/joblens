# pnpm 11+ 的工程设置统一放在这里（package.json 里的 pnpm 字段已不再读取）
packages:
  - '.'

# 扁平 node_modules（接近 npm 布局）。
# 团队里 Windows 同学克隆后直接 install 即可，不依赖符号链接权限。
nodeLinker: hoisted

# 允许 esbuild 的安装脚本（需要落位平台二进制）
allowBuilds:
  esbuild: true
  # 显式拒绝：tesseract.js 的脚本会去拉语言包，我们改为运行时按需加载
  tesseract.js: false

# 每次 run 前不重复做依赖校验
verifyDepsBeforeRun: false
